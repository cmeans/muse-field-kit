name: Feature request
description: A new capability, or a change to how something works
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        A change to a folder's mechanism (its SETUP.md lists what counts) is decided with the maintainer and Muse before anyone writes it: say here what problem it solves, and the review happens on this issue.
        **Credential Lockbox has moved:** request its features in https://github.com/credential-lockbox/credential-lockbox instead.
  - type: dropdown
    id: folder
    attributes:
      label: Folder
      options:
        - A new folder (a pattern you'd like covered)
        - The repository itself
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you think it should work. A diff or exact wording is welcome (CONTRIBUTING.md, license of contributions).
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
