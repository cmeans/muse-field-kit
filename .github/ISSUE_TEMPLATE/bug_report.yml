name: Bug report
description: Something doesn't work as a folder's docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **An exploitable security flaw never goes here:** report it privately instead (SECURITY.md).
        Never paste a credential, a private key or a real blob. Use the published test keys under the folder's `test/` directory to reproduce.
  - type: dropdown
    id: folder
    attributes:
      label: Folder
      options:
        - encrypted-credential-handoff
        - Other / the repository itself
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag you downloaded, or the commit you used (`git rev-parse --short HEAD`).
      placeholder: "v0.2.0 or abc1234"
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Which side
      options:
        - The user's side (handoff.sh, handoff.ps1)
        - The agent's side (agent-setup.sh, consume.py, wrappers)
        - The tests or CI
        - The docs
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Android
        - iOS
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Tool versions
      description: The output of the tools the folder uses, e.g. `bash --version | head -1`, `python3 --version`, `age --version`, `jq --version` (on Windows, `$PSVersionTable.PSVersion`). A script's setup check (`handoff.sh --check-setup`, `handoff.ps1 -CheckSetup`, `agent-setup.sh --check-setup`) prints these, and no secret.
      render: shell
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The script's messages, with anything secret removed.
      render: shell
    validations:
      required: false
