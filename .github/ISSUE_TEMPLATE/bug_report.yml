name: Bug report
description: Something doesn't work as a folder's docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **An exploitable security flaw never goes here:** report it privately instead (SECURITY.md).
        **Credential Lockbox has moved:** report its problems in https://github.com/credential-lockbox/credential-lockbox instead.
        Never paste a credential, a private key or a real blob. If the folder has published test keys, use them to reproduce.
  - type: dropdown
    id: folder
    attributes:
      label: Folder
      options:
        - Other / the repository itself
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag, if the folder has releases, or the commit you used (`git rev-parse --short HEAD`).
      placeholder: "abc1234"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Android
        - iOS
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Tool versions
      description: The tools the folder uses, as their own `--version` prints them, if it uses any.
      render: shell
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The messages you saw, with anything secret removed.
      render: shell
    validations:
      required: false
