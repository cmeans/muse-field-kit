name: Platform test report
description: What happened when you ran a folder on a platform or tool version we don't test
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Reports from platforms the folders don't yet call reviewed (macOS, Windows, phones, older tools) help decide what the docs can claim. Use the published test keys under the folder's `test/` directory, never a real credential.
  - type: dropdown
    id: folder
    attributes:
      label: Folder
      options:
        - encrypted-credential-handoff
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "v0.1.0 or abc1234"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and version
      placeholder: "macOS 15.3 on Apple silicon, Windows 11 24H2, Android 15 with Termux 0.119"
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Tool versions
      description: The shell and every tool the folder uses, as their own `--version` prints them.
      render: shell
    validations:
      required: true
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: For example the folder's test suite (`test/run-test.sh`) and its last lines, or the setup steps you followed. On macOS, read issue #3 first; the suite isn't portable there yet.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Everything passed
        - Some checks failed or were skipped (details above)
        - It didn't run
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything you had to change or install, and anything surprising.
    validations:
      required: false
