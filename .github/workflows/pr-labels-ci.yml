name: PR Label Automation (CI)

# Label transitions when the CI workflow finishes on a PR: Awaiting CI ->
# Ready for QA on success, -> CI Failed on any other conclusion (failure,
# timed_out, cancelled, startup_failure, action_required and the rest:
# issue #124). Skipped while Dev Active is on (pr-labels.yml's on-unlabel
# takes over when it comes off).
#
# NOTE: references the CI workflow by name ("CI"); if ci.yml's name changes,
# update it here and in pr-labels.yml.
#
# LIMITATION: workflow_run always runs this file as it is on main, never a
# PR's copy, so a change to it takes effect only after merge. On the PR that
# adds it, the transitions are made by hand.
#
# Fork PRs: a fork PR's CI run uses the fork's own workflow files, so a fork
# could gut ci.yml (or add any workflow named "CI") and have it succeed. This
# job runs with the base repository's token, so it acts only on runs from this
# repository's own branches (head_repository == this repository): fork PRs
# are labeled by hand, as pr-labels.yml already does for them (issue #121).
# Within that, it finds a PR only by its head commit and head repository.
#
# workflow_dispatch is here so the file can be run once by hand after it
# first lands: the workflow_run listener doesn't always register until the
# workflow has had a run, and a dispatched run (which matches no job below)
# primes it.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  on-ci-complete:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.status == 'completed'
    runs-on: ubuntu-latest
    concurrency:
      group: pr-labels-ci-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Update CI labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          echo "CI on $HEAD_SHA: $CONCLUSION"
          # The open PR whose head commit AND head repository match this run.
          # Never by branch name: a fork chooses its branch name, and a fork
          # branch named after a maintainer branch would relabel that PR. A
          # run whose commit is no longer any PR's head matches nothing.
          PR=$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,headRefOid,headRepositoryOwner,headRepository \
            --jq '[.[] | select(.headRefOid == env.HEAD_SHA and (.headRepositoryOwner.login + "/" + .headRepository.name) == env.HEAD_REPO) | .number] | first // empty')
          if [ -z "$PR" ]; then
            echo "No open PR has $HEAD_SHA as its head — exiting"
            exit 0
          fi

          LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')
          if echo "$LABELS" | grep -qx "Dev Active"; then
            echo "Dev Active present — skipping"
            exit 0
          fi
          # CI Failed counts too: a run cancelled for this same head (a
          # reopen while CI runs, or a cancel and re-run) sets CI Failed,
          # and the run that replaces it must still be able to promote
          # (QA on #125). The head check below keeps a stale result out.
          if ! echo "$LABELS" | grep -qx -e "Awaiting CI" -e "CI Failed"; then
            echo "PR #$PR isn't at Awaiting CI or CI Failed — nothing to do"
            exit 0
          fi

          # A push since this run started makes its result stale: re-check
          # the head right before editing, so a commit with no CI of its own
          # is never promoted.
          NOW=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          if [ "$NOW" != "$HEAD_SHA" ]; then
            echo "PR #$PR moved to $NOW — this run's result is stale"
            exit 0
          fi

          if [ "$CONCLUSION" = success ]; then
            REMOVE=""
            for L in "Awaiting CI" "CI Failed"; do
              if echo "$LABELS" | grep -qx "$L"; then REMOVE="${REMOVE:+$REMOVE,}$L"; fi
            done
            gh pr edit "$PR" --repo "$REPO" --remove-label "$REMOVE"
            gh pr edit "$PR" --repo "$REPO" --add-label "Ready for QA"
          elif echo "$LABELS" | grep -qx "Awaiting CI"; then
            gh pr edit "$PR" --repo "$REPO" --remove-label "Awaiting CI"
            gh pr edit "$PR" --repo "$REPO" --add-label "CI Failed"
          else
            echo "PR #$PR is already at CI Failed"
          fi
