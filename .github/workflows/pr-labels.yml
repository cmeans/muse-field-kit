name: PR Label Automation

# Label transitions triggered by PR events (push, label, unlabel).
# Promotion when CI finishes lives in pr-labels-ci.yml (workflow_run trigger).
# Adapted from mcp-clipboard and mcp-synology.
#
# Fork PRs: a pull_request run from a fork gets a read-only token, so none of
# these jobs can label a fork's PR (and qa-gate.yml can't post its status).
# The maintainer labels those by hand.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, labeled, unlabeled]

permissions:
  pull-requests: write
  actions: read

jobs:
  # A new push resets the PR to Awaiting CI and removes stale QA/workflow
  # labels. Dev Active stays (it coexists with Awaiting CI: CI runs, but
  # won't promote until Dev Active is removed).
  on-push:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    steps:
      - name: Reset labels on new push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Read now, not from the event: adding Dev Active just before a push
          # removes Awaiting CI in on-label while this runs, and the event's
          # stale list would leave the PR with no workflow label at all.
          PR_LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name]')

          HAD_QA_ACTIVE=false
          if echo "$PR_LABELS" | grep -q '"QA Active"'; then
            HAD_QA_ACTIVE=true
          fi

          REMOVE=""
          for LABEL in "Ready for QA" "Ready for QA Signoff" "QA Approved" "QA Active" "QA Failed" "CI Failed"; do
            if echo "$PR_LABELS" | grep -q "\"$LABEL\""; then
              REMOVE="${REMOVE:+$REMOVE,}$LABEL"
            fi
          done
          if [ -n "$REMOVE" ]; then
            gh pr edit "$PR" --repo "$REPO" --remove-label "$REMOVE"
          fi

          if ! echo "$PR_LABELS" | grep -q '"Awaiting CI"'; then
            gh pr edit "$PR" --repo "$REPO" --add-label "Awaiting CI"
          fi

          if [ "$HAD_QA_ACTIVE" = true ]; then
            gh pr comment "$PR" --repo "$REPO" \
              --body "New commits pushed while QA was active. QA review invalidated — resetting to Awaiting CI."
          fi

  # Dev Active removed: if CI already passed on the head commit, promote
  # straight to Ready for QA; if it failed, CI Failed; if it's still running,
  # Awaiting CI stays and pr-labels-ci.yml promotes when it completes.
  on-unlabel:
    if: >-
      github.event.action == 'unlabeled'
      && github.event.label.name == 'Dev Active'
    runs-on: ubuntu-latest
    steps:
      - name: Transition after Dev Active removed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PR_LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name]')
          if echo "$PR_LABELS" | grep -q '"Dev Active"'; then
            echo "Dev Active is back — nothing to do"
            exit 0
          fi
          # Dev Active came off without a push: a verdict or a review in
          # progress stands, and promoting beside it would leave conflicting
          # labels (Ready for QA next to QA Approved, with QA Gate green).
          for LABEL in "QA Active" "QA Failed" "Ready for QA Signoff" "QA Approved"; do
            if echo "$PR_LABELS" | grep -q "\"$LABEL\""; then
              echo "$LABEL present — not promoting"
              exit 0
            fi
          done
          # The latest CI run on the head commit; a run still in progress has
          # no conclusion yet.
          CONCLUSION=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=pull_request" \
            --jq '.workflow_runs[0] | if . == null then "" elif .status != "completed" then "" else .conclusion end')

          REMOVE=""
          for LABEL in "Awaiting CI" "CI Failed"; do
            if echo "$PR_LABELS" | grep -q "\"$LABEL\""; then
              REMOVE="${REMOVE:+$REMOVE,}$LABEL"
            fi
          done
          case "$CONCLUSION" in
            success)
              if [ -n "$REMOVE" ]; then gh pr edit "$PR" --repo "$REPO" --remove-label "$REMOVE"; fi
              gh pr edit "$PR" --repo "$REPO" --add-label "Ready for QA"
              ;;
            failure|timed_out)
              if [ -n "$REMOVE" ]; then gh pr edit "$PR" --repo "$REPO" --remove-label "$REMOVE"; fi
              gh pr edit "$PR" --repo "$REPO" --add-label "CI Failed"
              ;;
            *)
              if ! echo "$PR_LABELS" | grep -q '"Awaiting CI"'; then
                gh pr edit "$PR" --repo "$REPO" --add-label "Awaiting CI"
              fi
              ;;
          esac

  # A workflow label was added: remove the labels it replaces.
  on-label:
    if: >-
      github.event.action == 'labeled'
      && contains(fromJSON('["Ready for QA","QA Active","Dev Active","Ready for QA Signoff","QA Failed","QA Approved"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - name: Clean up stale labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADDED_LABEL: ${{ github.event.label.name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Read now, not from the event, as on-push and on-unlabel do: labels
          # changed since the event would otherwise be missed.
          PR_LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name]')

          remove_if_present() {
            if echo "$PR_LABELS" | grep -q "\"$1\""; then
              gh pr edit "$PR" --repo "$REPO" --remove-label "$1"
            fi
          }

          case "$ADDED_LABEL" in
            "Ready for QA")
              remove_if_present "Awaiting CI"
              remove_if_present "CI Failed"
              ;;
            "QA Active")
              remove_if_present "Ready for QA"
              ;;
            "Dev Active")
              remove_if_present "QA Failed"
              remove_if_present "CI Failed"
              remove_if_present "Awaiting CI"
              remove_if_present "Ready for QA"
              ;;
            "Ready for QA Signoff")
              remove_if_present "QA Active"
              ;;
            "QA Failed")
              remove_if_present "QA Active"
              remove_if_present "Ready for QA Signoff"
              ;;
            "QA Approved")
              remove_if_present "Ready for QA Signoff"
              ;;
          esac
