name: Release

# Builds the kit's four scripts (handoff.sh, handoff.ps1, agent-setup.sh,
# consume.py) and SHA256SUMS from the tagged tree, attests the four scripts,
# and publishes them as a GitHub Release whose notes are the
# CHANGELOG section for the version.
#
# Two jobs. "build" has the workflow's read-only token and no OIDC token: it
# decides, checks, builds, verifies and uploads the files as artifacts. Only
# "publish" holds write permissions and id-token, and it runs only when
# build decided to publish, so a dry run never has either.
#
# Publishing rule (one step in build, "decide", sets the output publish
# depends on):
#   - a push of a release tag, KIT-vX.Y.Z (such as
#     credential-lockbox-v1.2.3), publishes;
#   - a workflow_dispatch publishes only with dry_run == 'false' AND when run
#     on such a tag (github.ref matches refs/tags/*-v*);
#   - every other case is a dry run: the assets are built and verified,
#     nothing is attested or published. A dispatch from a branch never
#     publishes.
# A dry run on a branch has no tag, so it skips the checks that need one (the
# tagged commit is on main and passed CI; the CHANGELOG heading) and builds
# the assets only. Only credential-lockbox has release assets
# today; a tag for another kit is refused until its assets are added here.
# The repository's "release tags" ruleset lets only the maintainer create,
# move or delete a v* or *-v* tag.

on:
  push:
    tags: ['*-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only (true), or publish when run on a KIT-vX.Y.Z tag (false)"
        type: choice
        options: ['true', 'false']
        default: 'true'

# Read-only for the whole workflow; the publish job raises what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read # the tagged commit's ci-ok check run
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All of main's history, so the tagged commit can be checked
          # against it.
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether to publish
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: |
          on_tag=false
          case "$REF" in refs/tags/*-v*) on_tag=true ;; esac
          publish=false
          if [ "$EVENT_NAME" = push ] && [ "$on_tag" = true ]; then
            publish=true
            echo "case: push of tag $REF, publishing"
          elif [ "$EVENT_NAME" = workflow_dispatch ] && [ "$DRY_RUN" = false ] && [ "$on_tag" = true ]; then
            publish=true
            echo "case: dispatch on tag $REF with dry_run=false, publishing"
          elif [ "$EVENT_NAME" = workflow_dispatch ] && [ "$DRY_RUN" = false ]; then
            echo "case: dispatch with dry_run=false but $REF is not a KIT-vX.Y.Z tag, dry run"
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "case: dispatch with dry_run=$DRY_RUN, dry run"
          else
            echo "case: event $EVENT_NAME on $REF, dry run"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "on_tag=$on_tag" >> "$GITHUB_OUTPUT"

      - name: Check the tag, its commit and the CHANGELOG
        id: tag
        if: steps.decide.outputs.on_tag == 'true'
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tagged commit must be on main.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "$TAG ($GITHUB_SHA) is not on main"
            exit 1
          fi
          # The kit is the tag's prefix; only credential-lockbox
          # has release assets (release-assets.sh).
          kit=${TAG%-v*}
          if [ "$kit" != credential-lockbox ]; then
            echo "$TAG is for kit '$kit', which has no release assets in this workflow"
            exit 1
          fi
          # The tagged commit's ci-ok must have passed (the script is tested
          # in CI). Tagged too soon after the merge, CI is still running, and
          # ci-ok reads "missing" (it starts only after the other jobs) or
          # "pending": CONTRIBUTING, Releases, says what to do then.
          if ! state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=ci-ok&per_page=100" | .github/scripts/ci-ok-state.sh); then
            echo "$TAG ($GITHUB_SHA): ci-ok is ${state:-unreadable}, not success; not releasing."
            echo "If CI on this commit is still running, wait for it to finish; then see CONTRIBUTING.md, Releases."
            exit 1
          fi
          # The tag must be KIT-vX.Y.Z with a CHANGELOG heading for it; the
          # section is the release notes (the script is tested in CI). Only
          # stdout is captured: an error message goes to the log, never into
          # $GITHUB_OUTPUT or the release title.
          version=$(.github/scripts/release-notes.sh "$TAG" "$kit/CHANGELOG.md" "$RUNNER_TEMP/notes/notes.md")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release notes ($(wc -l < "$RUNNER_TEMP/notes/notes.md") lines):"
          cat "$RUNNER_TEMP/notes/notes.md"

      - name: Build the assets
        run: |
          .github/scripts/release-assets.sh "$RUNNER_TEMP/assets"
          ls -l "$RUNNER_TEMP/assets"

      - name: Verify the assets
        run: |
          cd "$RUNNER_TEMP/assets"
          sha256sum -c SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" -eq 4 ]
          for f in agent-setup.sh consume.py handoff.ps1 handoff.sh; do
            cmp "$f" "$GITHUB_WORKSPACE/credential-lockbox/$f"
          done
          [ "$(printf '%s\n' * | LC_ALL=C sort | tr '\n' ' ')" = "SHA256SUMS agent-setup.sh consume.py handoff.ps1 handoff.sh " ]

      - name: Upload the assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          retention-days: 7

      - name: Upload the release notes
        if: steps.decide.outputs.on_tag == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        env:
          PUBLISH: ${{ steps.decide.outputs.publish }}
        run: |
          {
            if [ "$PUBLISH" = true ]; then
              echo "Assets built and verified; the publish job attests and releases them."
            else
              echo "Dry run: the assets were built and verified; nothing was attested or published."
            fi
            printf '\140\140\140\n'
            cat "$RUNNER_TEMP/assets/SHA256SUMS"
            printf '\140\140\140\n'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the attestations
      attestations: write # store the attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - name: Re-verify the downloaded assets
        run: |
          cd "$RUNNER_TEMP/assets"
          sha256sum -c SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" -eq 4 ]
          [ "$(printf '%s\n' * | LC_ALL=C sort | tr '\n' ' ')" = "SHA256SUMS agent-setup.sh consume.py handoff.ps1 handoff.sh " ]
          [ -s "$RUNNER_TEMP/notes/notes.md" ]

      - name: Refuse if the release already exists
        # Before attesting, so a re-run after a published release does not
        # attest again.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; not attesting or publishing again. Delete it first if it must be redone."
            exit 1
          fi

      - name: Refuse if the tag no longer points at the built commit
        # Between build and publish the tag could have been moved (only the
        # maintainer can, under the ruleset); the release must be for the
        # commit that was built and checked.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # refs/tags/, so a branch of the same name can't be resolved instead.
          now=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          if [ "$now" != "$GITHUB_SHA" ]; then
            echo "$TAG now points at $now, not the built commit $GITHUB_SHA; not attesting or publishing"
            exit 1
          fi

      - name: Attest the scripts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/assets/handoff.sh
            ${{ runner.temp }}/assets/handoff.ps1
            ${{ runner.temp }}/assets/agent-setup.sh
            ${{ runner.temp }}/assets/consume.py

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Again, right before creating it: attesting takes seconds, and a
          # tag moved in that time would otherwise still get a release. (The
          # check before attesting stays, so a moved tag isn't attested.)
          # A re-run then attests again once the tag is back on the built
          # commit (the release-exists check passes while there's none).
          if ! now=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha); then
            echo "could not read $TAG from the API; the scripts were attested, but no release was created. Run Release again on the tag, or if the tag was deleted, release a new version (CONTRIBUTING.md, Releases)"
            exit 1
          fi
          if [ "$now" != "$GITHUB_SHA" ]; then
            echo "$TAG now points at $now, not the built commit $GITHUB_SHA; the scripts were attested, but no release was created. If the tag was moved by mistake, that move started a Release run for the wrong commit: cancel it first (or delete its release if it published), then put the tag back on $GITHUB_SHA, which starts a new run. If on purpose, its own run releases it (CONTRIBUTING.md, Releases)"
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Credential Lockbox $VERSION" \
            --notes-file "$RUNNER_TEMP/notes/notes.md" \
            "$RUNNER_TEMP/assets/handoff.sh" \
            "$RUNNER_TEMP/assets/handoff.ps1" \
            "$RUNNER_TEMP/assets/agent-setup.sh" \
            "$RUNNER_TEMP/assets/consume.py" \
            "$RUNNER_TEMP/assets/SHA256SUMS"
