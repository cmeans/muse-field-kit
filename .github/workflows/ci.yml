name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token for every job: nothing here writes to the repository.
permissions:
  contents: read

# The age release the release-binary Linux run and the Windows job test
# against, pinned by SHA-256. Both values were checked once by hand against
# age's Sigsum proofs (sigsum-verify v1.0.0, age's published key and the
# sigsum-generic-2025-1 policy, from its v1.3.2 SIGSUM.md); the commands and
# results are in the PR that added them. To bump the version, fetch the new
# assets and their .proof files and verify them the same way first.
env:
  AGE_VERSION: v1.3.2
  AGE_LINUX_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
  AGE_WINDOWS_SHA256: f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # NOTE: pr-labels.yml and pr-labels-ci.yml find this workflow by its name
  # ("CI") and file (ci.yml). If either is renamed, update them too.
  # This job's name ("encrypted-credential-handoff") is a required check in
  # main's ruleset: if it is renamed, update the ruleset, or every PR waits
  # on a check that never comes.
  encrypted-credential-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions
        run: |
          python3 --version
          bash --version | head -1
          jq --version
          shellcheck --version | sed -n 2p
          pwsh --version
          script --version
          setsid --version
          command -v zsh dash ksh mksh || true
      - name: Execute bits are committed
        # A fresh clone must be able to run ./handoff.sh and friends.
        run: |
          set -o pipefail
          bad=$(git ls-files -s encrypted-credential-handoff \
            | awk '$1 != "100755" && $4 ~ /(\.sh|\.py)$/ { print $4 }')
          if [ -n "$bad" ]; then
            echo "not executable in git: $bad"
            exit 1
          fi
      - name: No CR line endings in the scripts and vectors
        # .gitattributes keeps them LF on checkout; this catches a commit
        # that slipped a CR in anyway.
        run: |
          bad=$(git ls-files -z -- '*.sh' '*.py' '*.json' '*.txt' | xargs -0 grep -l $'\r' || true)
          if [ -n "$bad" ]; then
            echo "CR line endings in: $bad"
            exit 1
          fi
      - name: shellcheck
        run: shellcheck encrypted-credential-handoff/*.sh encrypted-credential-handoff/test/*.sh
      - name: The scripts parse under bash 3.2 (macOS /bin/bash)
        # shellcheck doesn't know bash 3.2's parser bugs (a `)` in a case
        # pattern inside $(...) ends the substitution there).
        run: |
          docker run --rm -v "$PWD/encrypted-credential-handoff:/w:ro" -w /w \
            bash:3.2@sha256:2556c2da19c32c1614d318645c73a7bf64d38be21cf69e98e3ca51f053983719 \
            sh -c 'bash --version | head -1 && for f in agent-setup.sh handoff.sh test/run-test.sh; do bash -n "$f" || exit 1; done'
      - name: ruff
        run: pipx run ruff==0.15.7 check encrypted-credential-handoff/
      - name: A key file owned by another user, for the key-owner refusal
        # Ubuntu's /etc/shadow is group-readable, so run-test.sh finds no
        # owner-only file of another user's: give it a root-owned 0600 copy
        # of the dummy age identity, which is a published test vector.
        run: |
          sudo install -o root -g root -m 600 \
            encrypted-credential-handoff/test/test-dummy-identity.txt "$RUNNER_TEMP/root-owned-key.txt"
          echo "HANDOFF_TEST_OTHER_OWNER_KEY=$RUNNER_TEMP/root-owned-key.txt" >> "$GITHUB_ENV"
      - name: Install age from apt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age --version
          age-keygen --version
      - name: A misspelled or empty HANDOFF_TEST_ONLY fails (no false green)
        # An id that matches no section used to run nothing and still print
        # ALL INTEROP CHECKS PASSED. Also: every `if section` in run-test.sh is
        # in the list the check validates against.
        run: |
          cd encrypted-credential-handoff/test
          for ids in "9z" "1a 9z" " "; do
            if out=$(HANDOFF_TEST_ONLY="$ids" ./run-test.sh 2>&1); then
              echo "run-test.sh passed with HANDOFF_TEST_ONLY='$ids'"
              exit 1
            fi
            case "$out" in
              *"FAIL: HANDOFF_TEST_ONLY"*) ;;
              *) echo "HANDOFF_TEST_ONLY='$ids': wrong failure: $out"; exit 1 ;;
            esac
          done
          out=$(HANDOFF_TEST_ONLY="1a" ./run-test.sh 2>&1)
          case "$out" in *"ran: 1a"*) ;; *) echo "HANDOFF_TEST_ONLY=1a did not report ran: 1a"; exit 1 ;; esac
          declared=$(grep -o '^if section [0-9a-z]*' run-test.sh | awk '{print $3}' | tr '\n' ' ')
          known=$(sed -n 's/^KNOWN_IDS="\(.*\)"/\1/p' run-test.sh)
          if [ "${declared% }" != "$known" ]; then
            echo "sections in run-test.sh ($declared) differ from KNOWN_IDS ($known)"
            exit 1
          fi
      - name: Interop and refusal tests (apt age)
        # In CI, every check must run: a skip line fails the step, and so does
        # an "n/a on this OS" line (Linux has everything those cases need; only
        # macOS and Windows may lack it).
        # pipefail: GitHub's default bash runs with -e only, so without it
        # tee's exit status would hide a failing suite.
        run: |
          set -o pipefail
          ./encrypted-credential-handoff/test/run-test.sh | tee "$RUNNER_TEMP/run-test-apt.log"
          if grep -E '^(skip:|n/a on this OS)' "$RUNNER_TEMP/run-test-apt.log"; then
            echo "a check was skipped in CI"
            exit 1
          fi
      - name: handoff.ps1 checks under PowerShell 7 on Linux
        # The platform-independent half of run-test.ps1, so a handoff.sh and
        # handoff.ps1 drift shows on every PR. The Windows-only cases print
        # "n/a on this OS" and are expected here; a skip or FAIL is not.
        run: |
          set -o pipefail
          pwsh -NoProfile -File encrypted-credential-handoff/test/run-test.ps1 2>&1 | tee "$RUNNER_TEMP/run-test-ps.log"
          if grep -E '^(skip:|FAIL)' "$RUNNER_TEMP/run-test-ps.log"; then
            echo "a PowerShell check failed or was skipped"
            exit 1
          fi
          [ "$(tail -n 1 "$RUNNER_TEMP/run-test-ps.log")" = PASS ] || { echo "run-test.ps1 did not end in PASS"; exit 1; }
      - name: Install the age release binary (SHA-256 pinned)
        run: |
          mkdir -p "$RUNNER_TEMP/age-release"
          cd "$RUNNER_TEMP/age-release"
          curl -fsSLO "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz"
          echo "$AGE_LINUX_SHA256  age-$AGE_VERSION-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "age-$AGE_VERSION-linux-amd64.tar.gz"
          "$PWD/age/age" --version
          "$PWD/age/age-keygen" --version
          echo "HANDOFF_TEST_AGE_DIR=$PWD/age" >> "$GITHUB_ENV"
      - name: Interop and refusal tests (age release binary)
        run: |
          set -o pipefail
          export PATH="$HANDOFF_TEST_AGE_DIR:$PATH"
          export HANDOFF_TEST_AGE="$HANDOFF_TEST_AGE_DIR/age" HANDOFF_TEST_AGE_KEYGEN="$HANDOFF_TEST_AGE_DIR/age-keygen"
          command -v age
          ./encrypted-credential-handoff/test/run-test.sh | tee "$RUNNER_TEMP/run-test-release.log"
          grep -q "^age: .*$HANDOFF_TEST_AGE_DIR/age" "$RUNNER_TEMP/run-test-release.log" || { echo "the suite did not use the release binary"; exit 1; }
          if grep -E '^(skip:|n/a on this OS)' "$RUNNER_TEMP/run-test-release.log"; then
            echo "a check was skipped in CI"
            exit 1
          fi

  # Older age releases, built from source (go install, checked against
  # sum.golang.org), against the agent side. Not required for merging at first.
  linux-age-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        age: [v1.0.0, v1.1.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Build age ${{ matrix.age }}
        # GONOSUMDB stays empty (and GONOSUMCHECK unset), so sum.golang.org
        # verifies the modules; GOFLAGS=-mod=mod only lets go install resolve
        # them.
        env:
          GOFLAGS: -mod=mod
          GONOSUMDB: ""
        run: |
          mkdir -p "$RUNNER_TEMP/age-bin"
          GOBIN="$RUNNER_TEMP/age-bin" go install "filippo.io/age/cmd/...@${{ matrix.age }}"
          echo "$RUNNER_TEMP/age-bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          go version
          python3 --version
          bash --version | head -1
          jq --version
          age --version
          age-keygen --version
      - name: Agent-side checks
        # The sections that run consume.py, agent-setup.sh or the round trip
        # from handoff.sh, which is where age's own behavior (decrypt,
        # age-keygen -y, header and error text) reaches the scripts:
        # 1a-1d, 2a-2b consume.py; 3a handoff.sh -> consume.py; 4a-4b
        # agent-setup.sh; 5a the refusals and age's environment; 6 rotation and
        # --rewrap; 8 --check-setup. The rest (3b, 5, 5b, 7) test handoff.sh
        # input rules and platform facilities that don't depend on the age
        # version, and 5 needs the root-owned key and a terminal.
        run: |
          set -o pipefail
          export HANDOFF_TEST_ONLY="1a 1b 1c 1d 2a 2b 3a 4a 4b 5a 6 8"
          ./encrypted-credential-handoff/test/run-test.sh | tee "$RUNNER_TEMP/run-test.log"
          grep -q "^age: .*${{ matrix.age }}" "$RUNNER_TEMP/run-test.log" || echo "note: age --version does not show ${{ matrix.age }}"
          if grep -E '^(skip:|n/a on this OS)' "$RUNNER_TEMP/run-test.log"; then
            echo "a check was skipped in CI"
            exit 1
          fi

  macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install age and jq
        run: |
          brew install age jq
      - name: Tool versions
        run: |
          sw_vers
          python3 --version
          /bin/bash --version | head -1
          bash --version | head -1
          jq --version
          age --version
          age-keygen --version
          command -v script zsh dash ksh mksh || true
      - name: A key file owned by another user, for the key-owner refusal
        run: |
          sudo install -o root -g wheel -m 600 \
            encrypted-credential-handoff/test/test-dummy-identity.txt "$RUNNER_TEMP/root-owned-key.txt"
          echo "HANDOFF_TEST_OTHER_OWNER_KEY=$RUNNER_TEMP/root-owned-key.txt" >> "$GITHUB_ENV"
      - name: Interop and refusal tests
        # A skip line fails the step. "n/a on this OS" lines (no /proc, no
        # /dev/shm, no setsid on macOS) are allowed and printed.
        run: |
          set -o pipefail
          ./encrypted-credential-handoff/test/run-test.sh | tee "$RUNNER_TEMP/run-test.log"
          grep '^n/a on this OS' "$RUNNER_TEMP/run-test.log" || true
          if grep '^skip:' "$RUNNER_TEMP/run-test.log"; then
            echo "a check was skipped in CI"
            exit 1
          fi

  # The Windows side (handoff.ps1) only: no bash, and consume.py, agent-setup.sh
  # and run-test.sh are never run here (the agent side is out of scope on
  # Windows). windows-interop opens what this job writes.
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install age.exe (SHA-256 pinned)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $dir = Join-Path $env:RUNNER_TEMP 'age-release'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $dir "age-$env:AGE_VERSION-windows-amd64.zip"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/FiloSottile/age/releases/download/$env:AGE_VERSION/age-$env:AGE_VERSION-windows-amd64.zip" -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($got -ne $env:AGE_WINDOWS_SHA256) { throw "age zip sha256 is $got, expected $env:AGE_WINDOWS_SHA256" }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dir 'age') -Encoding ascii
      - name: Tool versions
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          age --version
          age-keygen --version
      - name: handoff.ps1 tests under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-Process -Id $PID).Path
          $script = Join-Path $PWD 'encrypted-credential-handoff\test\run-test.ps1'
          $log = Join-Path $env:RUNNER_TEMP 'run-test-ps5.log'
          $p = Start-Process -FilePath $exe -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', ('"' + $script + '"')) -NoNewWindow -Wait -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          Get-Content -LiteralPath $log
          Get-Content -LiteralPath "$log.err"
          $all = @(Get-Content -LiteralPath $log) + @(Get-Content -LiteralPath "$log.err")
          $all | Where-Object { $_ -like 'n/a on this OS*' }
          if ($p.ExitCode -ne 0) { throw "run-test.ps1 exited $($p.ExitCode)" }
          if ($all | Where-Object { $_ -match '^(skip:|FAIL)' }) { throw 'a check failed or was skipped' }
          if ((Get-Content -LiteralPath $log)[-1] -ne 'PASS') { throw 'run-test.ps1 did not end in PASS' }
      - name: handoff.ps1 tests under PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-Process -Id $PID).Path
          $script = Join-Path $PWD 'encrypted-credential-handoff\test\run-test.ps1'
          $log = Join-Path $env:RUNNER_TEMP 'run-test-ps7.log'
          $p = Start-Process -FilePath $exe -ArgumentList @('-NoProfile', '-File', ('"' + $script + '"')) -NoNewWindow -Wait -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          Get-Content -LiteralPath $log
          Get-Content -LiteralPath "$log.err"
          $all = @(Get-Content -LiteralPath $log) + @(Get-Content -LiteralPath "$log.err")
          $all | Where-Object { $_ -like 'n/a on this OS*' }
          if ($p.ExitCode -ne 0) { throw "run-test.ps1 exited $($p.ExitCode)" }
          if ($all | Where-Object { $_ -match '^(skip:|FAIL)' }) { throw 'a check failed or was skipped' }
          if ((Get-Content -LiteralPath $log)[-1] -ne 'PASS') { throw 'run-test.ps1 did not end in PASS' }
      - name: Upload the blobs both editions wrote
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-interop-blobs
          path: ${{ runner.temp }}/handoff-ps-interop
          if-no-files-found: error
          retention-days: 3

  # Opens, on Linux with the reference consume.py, the blobs handoff.ps1 made
  # on Windows under 5.1 and 7: the check output, the non-ASCII values and the
  # CRLF PEM must come out byte for byte.
  windows-interop:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-interop-blobs
          path: ${{ runner.temp }}/windows-interop
      - name: Install age from apt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age --version
          python3 --version
      - name: consume.py opens the Windows blobs
        run: |
          find "$RUNNER_TEMP/windows-interop" -type f | sort | head -80
          python3 -I encrypted-credential-handoff/test/check-interop.py \
            "$RUNNER_TEMP/windows-interop/ps5" "$RUNNER_TEMP/windows-interop/ps7"
