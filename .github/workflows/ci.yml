name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token for every job: nothing here writes to the repository.
permissions:
  contents: read

# The age release the release-binary Linux run and the Windows job test
# against, pinned by SHA-256. Both values were checked once by hand against
# age's Sigsum proofs (sigsum-verify v1.0.0, age's published key and the
# sigsum-generic-2025-1 policy, from its v1.3.2 SIGSUM.md); the commands and
# results are in the PR that added them. To bump the version, fetch the new
# assets and their .proof files and verify them the same way first.
env:
  AGE_VERSION: v1.3.2
  AGE_LINUX_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
  AGE_WINDOWS_SHA256: f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # NOTE: pr-labels.yml and pr-labels-ci.yml find this workflow by its name
  # ("CI") and file (ci.yml). If either is renamed, update them too.
  # main's ruleset requires QA Gate and one CI check: "ci-ok" (the last job,
  # which needs all the others). If a required job is renamed, update the
  # ruleset, or every PR waits on a check that never comes; and release.yml,
  # which refuses a tag whose commit has no successful "ci-ok" run
  # (.github/scripts/ci-ok-state.sh), or every release is refused.
  credential-lockbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions
        run: |
          python3 --version
          bash --version | head -1
          jq --version
          shellcheck --version | sed -n 2p
          pwsh --version
          script --version
          setsid --version
          command -v zsh dash ksh mksh || true
      - name: Execute bits are committed
        # A fresh clone must be able to run ./handoff.sh and friends.
        run: |
          set -o pipefail
          bad=$(git ls-files -s credential-lockbox \
            | awk '$1 != "100755" && $4 ~ /(\.sh|\.py)$/ { print $4 }')
          if [ -n "$bad" ]; then
            echo "not executable in git: $bad"
            exit 1
          fi
      - name: No CR line endings in the scripts and vectors
        # .gitattributes keeps them LF on checkout; this catches a commit
        # that slipped a CR in anyway.
        run: |
          bad=$(git ls-files -z -- '*.sh' '*.py' '*.json' '*.txt' '*.ps1' '*.age' | xargs -0 grep -l $'\r' || true)
          if [ -n "$bad" ]; then
            echo "CR line endings in: $bad"
            exit 1
          fi
      - name: shellcheck
        run: shellcheck credential-lockbox/*.sh credential-lockbox/test/*.sh
      - name: The scripts parse under bash 3.2 (macOS /bin/bash)
        # shellcheck doesn't know bash 3.2's parser bugs (a `)` in a case
        # pattern inside $(...) ends the substitution there). agent-setup.sh
        # also runs to its usage text in POSIX mode (POSIXLY_CORRECT), where
        # bash before 5.1 refuses process substitution unless the script leaves
        # that mode first; its process substitution comes before its usage
        # exit. handoff.sh's comes after its own, so a --help run here tests
        # nothing for it: the macOS job's POSIX-mode round trips (run-test.sh,
        # under the bash 3.2 that job checks is on PATH) cover that one.
        run: |
          docker run --rm -v "$PWD/credential-lockbox:/w:ro" -w /w \
            bash:3.2@sha256:2556c2da19c32c1614d318645c73a7bf64d38be21cf69e98e3ca51f053983719 \
            sh -c 'bash --version | head -1 && for f in agent-setup.sh handoff.sh test/run-test.sh; do bash -n "$f" || exit 1; done &&
              env POSIXLY_CORRECT=1 bash agent-setup.sh --help >/dev/null'
      - name: ruff
        # Pinned by hash in .github/ruff-requirements.txt (issue #67 F20).
        run: |
          python3 -m venv "$RUNNER_TEMP/ruff"
          "$RUNNER_TEMP/ruff/bin/pip" install -q --require-hashes --only-binary=:all: -r .github/ruff-requirements.txt
          "$RUNNER_TEMP/ruff/bin/ruff" --version
          "$RUNNER_TEMP/ruff/bin/ruff" check credential-lockbox/ .github/scripts/md-links.py
      - name: The docs link the documents they name, and every relative link to a document works
        # md-links.py: in each section, the first mention of another .md in the
        # repo is a link; every relative .md link names a file and heading that
        # exist. Each bad fixture must fail with its own message, and the good
        # one must pass, or the check is a false green (or a false red).
        run: |
          python3 -I .github/scripts/md-links.py .
          fx() { d="$RUNNER_TEMP/md-$1"; mkdir -p "$d/sub"; printf '# T\n\n## Two words\n' > "$d/OTHER.md"; printf '# S\n' > "$d/STORES.md"; printf '%b' "$2" > "$d/sub/A.md"; echo "$d"; }
          for c in 'unlinked|See `OTHER.md`.\n|unlinked `OTHER.md`' \
                   'broken|See [it](../OTHER.md#nope).\n|no heading #nope' \
                   'missing|See [it](../GONE.md).\n|link to missing' \
                   'stem|Then follow STORES.\n|unlinked STORES'; do
            IFS='|' read -r name text want <<<"$c"
            d=$(fx "$name" "# A\n\n$text")
            if out=$(python3 -I .github/scripts/md-links.py "$d"); then
              echo "md-links.py passed the $name fixture"; exit 1
            fi
            grep -qF "$want" <<<"$out" || { echo "the $name fixture failed for another reason: $out"; exit 1; }
          done
          # Not mentions: a generic one ("a `OTHER.md`"), a quoted one, a heading,
          # a prompt to paste, a later mention in a linked section.
          d=$(fx good '# A\n\nEach folder has a `OTHER.md`. "OTHER.md, step 2"\n\n## OTHER.md\n\n> Read OTHER.md.\n\nSee [`OTHER.md`](../OTHER.md#two-words), then `OTHER.md` again.\n')
          python3 -I .github/scripts/md-links.py "$d"
      - name: A key file owned by another user, for the key-owner refusal
        # Ubuntu's /etc/shadow is group-readable, so run-test.sh finds no
        # owner-only file of another user's: give it a root-owned 0600 copy
        # of the dummy age identity, which is a published test vector.
        run: |
          sudo install -o root -g root -m 600 \
            credential-lockbox/test/test-dummy-identity.txt "$RUNNER_TEMP/root-owned-key.txt"
          echo "HANDOFF_TEST_OTHER_OWNER_KEY=$RUNNER_TEMP/root-owned-key.txt" >> "$GITHUB_ENV"
      - name: Key directories owned by another account and by root, for the key-directory checks
        # Each holds the runner's own 0600 copy of the dummy key: one in a
        # directory owned by nobody (refused), one in a root-owned 0755
        # directory (accepted).
        run: |
          for d in other-owner-dir:nobody root-dir:root; do
            dir="$RUNNER_TEMP/${d%%:*}"
            sudo install -d -o "${d#*:}" -m 755 "$dir"
            sudo install -o "$(id -u)" -g "$(id -g)" -m 600 credential-lockbox/test/test-dummy-identity.txt "$dir/id.txt"
          done
          echo "HANDOFF_TEST_OTHER_OWNER_DIR=$RUNNER_TEMP/other-owner-dir" >> "$GITHUB_ENV"
          echo "HANDOFF_TEST_ROOT_DIR=$RUNNER_TEMP/root-dir" >> "$GITHUB_ENV"
      - name: Install age from apt
        # Unpinned on purpose: see the macos job's Install step.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age --version
          age-keygen --version
      - name: Add a Latin-1 locale
        # run-test.sh's Latin-1 half of #75's test runs only where an
        # ISO-8859-1 locale exists, and no runner has one (issue #79 item 1);
        # the apt-age step below checks that its ok line is there.
        run: |
          sudo localedef -i en_US -f ISO-8859-1 en_US.ISO-8859-1
          [ "$(LC_ALL=en_US.ISO-8859-1 python3 -X utf8=0 -I -c 'import sys; print(sys.getfilesystemencoding())')" = iso8859-1 ]
      - name: A misspelled or empty HANDOFF_TEST_ONLY fails (no false green)
        # An id that matches no section used to run nothing and still print
        # ALL INTEROP CHECKS PASSED. Also: every `if section` in run-test.sh is
        # in the list the check validates against.
        run: |
          cd credential-lockbox/test
          for ids in "9z" "1a 9z" " "; do
            if out=$(HANDOFF_TEST_ONLY="$ids" ./run-test.sh 2>&1); then
              echo "run-test.sh passed with HANDOFF_TEST_ONLY='$ids'"
              exit 1
            fi
            case "$out" in
              *"FAIL: HANDOFF_TEST_ONLY"*) ;;
              *) echo "HANDOFF_TEST_ONLY='$ids': wrong failure: $out"; exit 1 ;;
            esac
          done
          out=$(HANDOFF_TEST_ONLY="1a" ./run-test.sh 2>&1)
          case "$out" in *"ran: 1a"*) ;; *) echo "HANDOFF_TEST_ONLY=1a did not report ran: 1a"; exit 1 ;; esac
          declared=$(grep -o '^if section [0-9a-z]*' run-test.sh | awk '{print $3}' | tr '\n' ' ')
          known=$(sed -n 's/^KNOWN_IDS="\(.*\)"/\1/p' run-test.sh)
          if [ "${declared% }" != "$known" ]; then
            echo "sections in run-test.sh ($declared) differ from KNOWN_IDS ($known)"
            exit 1
          fi
      - name: Interop and refusal tests (apt age)
        # In CI, every check must run: a skip line fails the step, and so does
        # an "n/a on this OS" line (Linux has everything those cases need; only
        # macOS and Windows may lack it).
        # pipefail: GitHub's default bash runs with -e only, so without it
        # tee's exit status would hide a failing suite.
        run: |
          set -o pipefail
          ./credential-lockbox/test/run-test.sh | tee "$RUNNER_TEMP/run-test-apt.log"
          grep -qx 'ok (run mode passes UTF-8 bytes under a Latin-1 locale)' "$RUNNER_TEMP/run-test-apt.log" \
            || { echo "the Latin-1 locale check did not run"; exit 1; }
          if grep -E '^(skip:|n/a on this OS)' "$RUNNER_TEMP/run-test-apt.log"; then
            echo "a check was skipped in CI"
            exit 1
          fi
      - name: handoff.ps1 checks under PowerShell 7 on Linux
        # The platform-independent half of run-test.ps1, so a handoff.sh and
        # handoff.ps1 drift shows on every PR. The Windows-only cases print
        # "n/a on this OS" and are expected here; a skip or FAIL is not.
        run: |
          set -o pipefail
          pwsh -NoProfile -File credential-lockbox/test/run-test.ps1 2>&1 | tee "$RUNNER_TEMP/run-test-ps.log"
          if grep -E '^(skip:|FAIL)' "$RUNNER_TEMP/run-test-ps.log"; then
            echo "a PowerShell check failed or was skipped"
            exit 1
          fi
          [ "$(tail -n 1 "$RUNNER_TEMP/run-test-ps.log")" = PASS ] || { echo "run-test.ps1 did not end in PASS"; exit 1; }
      - name: Install the age release binary (SHA-256 pinned)
        run: |
          mkdir -p "$RUNNER_TEMP/age-release"
          cd "$RUNNER_TEMP/age-release"
          curl -fsSLO "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz"
          echo "$AGE_LINUX_SHA256  age-$AGE_VERSION-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "age-$AGE_VERSION-linux-amd64.tar.gz"
          "$PWD/age/age" --version
          "$PWD/age/age-keygen" --version
          echo "HANDOFF_TEST_AGE_DIR=$PWD/age" >> "$GITHUB_ENV"
      - name: Interop and refusal tests (age release binary)
        run: |
          set -o pipefail
          export PATH="$HANDOFF_TEST_AGE_DIR:$PATH"
          export HANDOFF_TEST_AGE="$HANDOFF_TEST_AGE_DIR/age" HANDOFF_TEST_AGE_KEYGEN="$HANDOFF_TEST_AGE_DIR/age-keygen"
          command -v age
          ./credential-lockbox/test/run-test.sh | tee "$RUNNER_TEMP/run-test-release.log"
          grep -q "^age: .*$HANDOFF_TEST_AGE_DIR/age" "$RUNNER_TEMP/run-test-release.log" || { echo "the suite did not use the release binary"; exit 1; }
          if grep -E '^(skip:|n/a on this OS)' "$RUNNER_TEMP/run-test-release.log"; then
            echo "a check was skipped in CI"
            exit 1
          fi

  # The release asset set (the four scripts and SHA256SUMS) builds, is
  # byte-identical to the tree, and INSTALL-linux-macos.md's verify command works on it.
  # release.yml builds the same set with the same script.
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the assets
        run: |
          .github/scripts/release-assets.sh "$RUNNER_TEMP/assets"
          .github/scripts/release-assets.sh "$RUNNER_TEMP/assets-again"
          ls -l "$RUNNER_TEMP/assets"
      - name: The build is deterministic
        run: |
          for f in agent-setup.sh consume.py handoff.ps1 handoff.sh SHA256SUMS; do
            cmp "$RUNNER_TEMP/assets/$f" "$RUNNER_TEMP/assets-again/$f"
          done
      - name: Assets are byte-identical to the tree, and the set is exactly five files
        run: |
          for f in agent-setup.sh consume.py handoff.ps1 handoff.sh; do
            cmp "$RUNNER_TEMP/assets/$f" "credential-lockbox/$f"
          done
          [ "$(cd "$RUNNER_TEMP/assets" && printf "%s\n" * | LC_ALL=C sort | tr '\n' ' ')" = "SHA256SUMS agent-setup.sh consume.py handoff.ps1 handoff.sh " ] \
            || { echo "unexpected asset set"; ls -l "$RUNNER_TEMP/assets"; exit 1; }
      - name: SHA256SUMS is sha256sum -c clean, four sorted LF lines
        run: |
          cd "$RUNNER_TEMP/assets"
          sha256sum -c SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" -eq 4 ] || { echo "SHA256SUMS must have exactly four lines"; exit 1; }
          if grep -q $'\r' SHA256SUMS; then echo "CR in SHA256SUMS"; exit 1; fi
          [ "$(tail -c 1 SHA256SUMS | od -An -c | tr -d ' ')" = '\n' ] || { echo "SHA256SUMS must end in LF"; exit 1; }
          [ "$(awk '{print $2}' SHA256SUMS | tr '\n' ' ')" = "agent-setup.sh consume.py handoff.ps1 handoff.sh " ] \
            || { echo "SHA256SUMS names or order wrong"; cat SHA256SUMS; exit 1; }
          [ "$(grep -Ec '^[0-9a-f]{64}  (agent-setup\.sh|consume\.py|handoff\.(ps1|sh))$' SHA256SUMS)" -eq 4 ] \
            || { echo "SHA256SUMS is not in sha256sum format"; cat SHA256SUMS; exit 1; }
          # A changed byte in any of the four must fail the check.
          for f in agent-setup.sh consume.py handoff.ps1 handoff.sh; do
            rm -rf "$RUNNER_TEMP/tampered"
            mkdir "$RUNNER_TEMP/tampered"
            cp agent-setup.sh consume.py handoff.ps1 handoff.sh SHA256SUMS "$RUNNER_TEMP/tampered/"
            echo "# tampered" >> "$RUNNER_TEMP/tampered/$f"
            if (cd "$RUNNER_TEMP/tampered" && sha256sum -c SHA256SUMS); then
              echo "sha256sum -c passed on a tampered $f"
              exit 1
            fi
          done
      - name: INSTALL-linux-macos.md's verify command works on the assets
        # The command is read from INSTALL-linux-macos.md between its verify-macos-linux
        # markers, so a doc change that breaks it (or drops the markers)
        # fails here.
        run: |
          block=$(.github/scripts/readme-block.sh credential-lockbox/INSTALL-linux-macos.md verify-macos-linux)
          cmd=$(printf '%s\n' "$block" | grep '^sha256sum ' || true)
          [ -n "$cmd" ] || { echo "no sha256sum command in INSTALL-linux-macos.md's verify-macos-linux block"; exit 1; }
          echo "documented command: $cmd"
          # Only handoff.sh and SHA256SUMS downloaded, as INSTALL-linux-macos.md says.
          mkdir "$RUNNER_TEMP/sh-only"
          cp "$RUNNER_TEMP/assets/handoff.sh" "$RUNNER_TEMP/assets/SHA256SUMS" "$RUNNER_TEMP/sh-only/"
          cd "$RUNNER_TEMP/sh-only"
          bash -euo pipefail -c "$cmd"
      - name: release-notes.sh on the real CHANGELOG
        # release.yml uses this script; each released version has a dated
        # heading with a suffix, 9.9.9 has none. A new release adds its
        # version here, so a malformed heading fails CI before the tag.
        run: |
          for want in 0.1.0 0.2.0 0.2.1 0.3.0; do
            v=$(.github/scripts/release-notes.sh "credential-lockbox-v$want" credential-lockbox/CHANGELOG.md "$RUNNER_TEMP/notes-real.md")
            [ "$v" = "$want" ]
            [ -s "$RUNNER_TEMP/notes-real.md" ]
            if grep -q '^## ' "$RUNNER_TEMP/notes-real.md"; then echo "notes for $want run past the section"; exit 1; fi
          done
          if .github/scripts/release-notes.sh credential-lockbox-v9.9.9 credential-lockbox/CHANGELOG.md "$RUNNER_TEMP/notes-none.md" 2>/dev/null; then
            echo "release-notes.sh accepted a version with no heading"
            exit 1
          fi
          [ ! -e "$RUNNER_TEMP/notes-none.md" ]
      - name: release-notes.sh on synthetic cases
        run: |
          mkdir -p "$RUNNER_TEMP/demo-kit"
          cl="$RUNNER_TEMP/demo-kit/CHANGELOG.md"
          {
            echo '# Changelog'
            echo
            echo '## Unreleased'
            echo
            echo 'unreleased text'
            echo
            echo '## 0.1.0 — 2026-01-01 — dated'
            echo
            echo 'first line'
            echo
            echo '### Added'
            echo
            echo 'sub text'
            echo
            echo '## 0.1.1'
            echo
            echo 'patch text'
            echo
            echo '## 0.2.0'
            echo
          } > "$cl"
          rn=.github/scripts/release-notes.sh
          # Good tag, dated heading: the body runs through the ### subheading and stops at the next ##.
          v=$($rn demo-kit-v0.1.0 "$cl" "$RUNNER_TEMP/n1.md")
          [ "$v" = 0.1.0 ]
          grep -q '^first line$' "$RUNNER_TEMP/n1.md"
          grep -q '^### Added$' "$RUNNER_TEMP/n1.md"
          grep -q '^sub text$' "$RUNNER_TEMP/n1.md"
          if grep -Eq 'patch text|unreleased text' "$RUNNER_TEMP/n1.md"; then echo "notes leaked another section"; exit 1; fi
          # A heading with no suffix.
          $rn demo-kit-v0.1.1 "$cl" "$RUNNER_TEMP/n2.md" > /dev/null
          [ "$(cat "$RUNNER_TEMP/n2.md")" = "patch text" ]
          # Failures write nothing: a prefix (0.1 vs 0.1.0), a missing heading,
          # an empty section, bad tag shapes (the old repo-wide v0.1.0 form,
          # a pre-release, no kit), and a tag for another kit than the
          # CHANGELOG's folder.
          for t in demo-kit-v0.1 demo-kit-v0.3.0 demo-kit-v0.2.0 v0.1.0 demo-kit-0.1.0 demo-kit-v0.1.0-rc1 \
              demo-kit-v1.2 demo-kit-vx.y.z "demo-kit-v0.1.0 " -v0.1.0 Demo-kit-v0.1.0 demo--kit-v0.1.0 \
              other-kit-v0.1.0 kit-v0.1.0; do
            rm -f "$RUNNER_TEMP/nf.md"
            if $rn "$t" "$cl" "$RUNNER_TEMP/nf.md" 2>/dev/null; then
              echo "release-notes.sh accepted '$t'"
              exit 1
            fi
            [ ! -e "$RUNNER_TEMP/nf.md" ] || { echo "release-notes.sh wrote notes for '$t'"; exit 1; }
          done
          # A kit name with "-v" in it: the kit is everything before the last
          # "-v" (release.yml takes it the same way, ${TAG%-v*}).
          mkdir -p "$RUNNER_TEMP/demo-vault-kit"
          cp "$cl" "$RUNNER_TEMP/demo-vault-kit/CHANGELOG.md"
          v=$($rn demo-vault-kit-v0.1.1 "$RUNNER_TEMP/demo-vault-kit/CHANGELOG.md" "$RUNNER_TEMP/n3.md")
          [ "$v" = 0.1.1 ] || { echo "demo-vault-kit-v0.1.1 gave version '$v'"; exit 1; }
          tag=demo-vault-kit-v0.1.1
          [ "${tag%-v*}" = demo-vault-kit ] || { echo "release.yml's kit expression gave '${tag%-v*}'"; exit 1; }
      - name: ci-ok-state.sh on stub check-run replies
        # release.yml refuses a tag whose commit's newest ci-ok check run
        # (from GitHub Actions) isn't a success.
        run: |
          s=.github/scripts/ci-ok-state.sh
          run() { jq -n "{check_runs: [$1]}" | $s; }
          ok='{"id": 5, "name": "ci-ok", "app": {"slug": "github-actions"}, "status": "completed", "conclusion": "success"}'
          bad='{"id": 6, "name": "ci-ok", "app": {"slug": "github-actions"}, "status": "completed", "conclusion": "failure"}'
          rerun_ok='{"id": 8, "name": "ci-ok", "app": {"slug": "github-actions"}, "status": "completed", "conclusion": "success"}'
          wip='{"id": 7, "name": "ci-ok", "app": {"slug": "github-actions"}, "status": "in_progress", "conclusion": null}'
          other='{"id": 9, "name": "ci-ok", "app": {"slug": "someone-else"}, "status": "completed", "conclusion": "failure"}'
          expect() {  # WANT_RC WANT_OUT RUNS
            local out rc=0
            out=$(run "$3") || rc=$?
            [ "$rc" = "$1" ] && [ "$out" = "$2" ] || { echo "runs [$3]: got '$out' (exit $rc), want '$2' (exit $1)"; exit 1; }
          }
          expect 0 success "$ok"
          expect 1 failure "$bad"
          expect 1 "pending (in_progress)" "$wip"
          expect 1 missing ""
          expect 1 missing "$(jq -nc '{id: 1, name: "ci", app: {slug: "github-actions"}, status: "completed", conclusion: "success"}')"
          # The newest run decides (a rerun after a failure, or the reverse);
          # another app's run of the same name counts for nothing.
          expect 0 success "$rerun_ok, $bad"
          expect 1 failure "$bad, $ok"
          expect 1 "pending (in_progress)" "$ok, $wip"
          expect 0 success "$ok, $other"
      - name: The install pages' verify markers are enforced (a missing or unclosed pair fails)
        run: |
          fence=$(printf "\140\140\140sh")
          printf '# no markers\n' > "$RUNNER_TEMP/no-markers.md"
          printf '<!-- verify-windows:start -->\n%s\nx\n%s\n' "$fence" "$fence" > "$RUNNER_TEMP/unclosed.md"
          for n in verify-macos-linux verify-windows; do
            for f in no-markers unclosed; do
              if .github/scripts/readme-block.sh "$RUNNER_TEMP/$f.md" "$n" 2>/dev/null; then
                echo "readme-block.sh accepted $f.md for $n"
                exit 1
              fi
            done
          done
          .github/scripts/readme-block.sh credential-lockbox/INSTALL-windows.md verify-windows > /dev/null
      - name: release-assets.sh refuses a tree with a missing script
        # A copy of the script in a tree that has the other three scripts but
        # not handoff.sh: exit status 1, and no output directory.
        run: |
          t="$RUNNER_TEMP/broken-tree"
          mkdir -p "$t/.github/scripts" "$t/credential-lockbox"
          cp .github/scripts/release-assets.sh "$t/.github/scripts/"
          for f in agent-setup.sh consume.py handoff.ps1; do
            cp "credential-lockbox/$f" "$t/credential-lockbox/"
          done
          rc=0
          "$t/.github/scripts/release-assets.sh" "$RUNNER_TEMP/broken-out" 2>"$RUNNER_TEMP/broken.err" || rc=$?
          cat "$RUNNER_TEMP/broken.err"
          [ "$rc" -eq 1 ] || { echo "expected exit status 1, got $rc"; exit 1; }
          grep -q 'missing .*handoff.sh' "$RUNNER_TEMP/broken.err"
          [ ! -e "$RUNNER_TEMP/broken-out" ] || { echo "release-assets.sh wrote output despite the error"; exit 1; }
      - name: Collect what the Windows job checks
        # The Windows job verifies INSTALL-windows.md's PowerShell block against this
        # SHA256SUMS and handoff.ps1, the ones built here (the ones that ship).
        run: |
          mkdir "$RUNNER_TEMP/win-check"
          cp "$RUNNER_TEMP/assets/SHA256SUMS" "$RUNNER_TEMP/assets/handoff.ps1" "$RUNNER_TEMP/win-check/"
          .github/scripts/readme-block.sh credential-lockbox/INSTALL-windows.md verify-windows > "$RUNNER_TEMP/win-check/verify-windows.ps1"
      - name: Upload the assets for the Windows job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-check
          path: ${{ runner.temp }}/win-check
          if-no-files-found: error
          retention-days: 1

  # Older age releases, built from source (go install, checked against
  # sum.golang.org), against the agent side. Required for merging through
  # ci-ok, like every job here.
  linux-age-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        age: [v1.0.0, v1.1.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # An exact release, not "stable", so a new Go can't change this job
          # unannounced (issue #67 F20).
          go-version: 1.27.4
          cache: false
      - name: Build age ${{ matrix.age }}
        # GONOSUMDB stays empty (and GONOSUMCHECK unset), so sum.golang.org
        # verifies the modules; GOFLAGS=-mod=mod only lets go install resolve
        # them.
        env:
          GOFLAGS: -mod=mod
          GONOSUMDB: ""
          MATRIX_AGE: ${{ matrix.age }}
        run: |
          mkdir -p "$RUNNER_TEMP/age-bin"
          GOBIN="$RUNNER_TEMP/age-bin" go install "filippo.io/age/cmd/...@$MATRIX_AGE"
          echo "$RUNNER_TEMP/age-bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          go version
          python3 --version
          bash --version | head -1
          jq --version
          age --version
          age-keygen --version
      - name: Agent-side checks
        # The sections that run consume.py, agent-setup.sh or the round trip
        # from handoff.sh, which is where age's own behavior (decrypt,
        # age-keygen -y, header and error text) reaches the scripts:
        # 1a-1d, 2a-2b consume.py; 3a handoff.sh -> consume.py; 4a-4b
        # agent-setup.sh; 5a the refusals and age's environment; 6 rotation and
        # --rewrap; 8 --check-setup. The rest (3b, 5, 5b, 7) test handoff.sh
        # input rules and platform facilities that don't depend on the age
        # version, and 5 needs the root-owned key and a terminal.
        env:
          MATRIX_AGE: ${{ matrix.age }}
        run: |
          set -o pipefail
          export HANDOFF_TEST_ONLY="1a 1b 1c 1d 2a 2b 3a 4a 4b 5a 6 8"
          ./credential-lockbox/test/run-test.sh | tee "$RUNNER_TEMP/run-test.log"
          if ! grep -q "^age: .*$MATRIX_AGE" "$RUNNER_TEMP/run-test.log"; then
            echo "age --version does not show $MATRIX_AGE: the matrix did not test that version"
            exit 1
          fi
          if grep -E '^(skip:|n/a on this OS)' "$RUNNER_TEMP/run-test.log"; then
            echo "a check was skipped in CI"
            exit 1
          fi

  # handoff.sh under jq 1.6, the oldest it accepts (Ubuntu 22.04's apt jq).
  # jq 1.6 accepts a raw control byte inside a string (0x1F, for one), which
  # consume.py refuses, so there handoff.sh's own control-byte check is the
  # only guard; the 1.7 and newer jq the other jobs have refuse it
  # themselves, and would pass with that check gone. The sections that run
  # handoff.sh's input rules: 3a the round trip, 3b the maximum payload's
  # bytes, 5b the payload table (payload-cases.json's rawunitsep row is that
  # case). Run as a plain user, as the suite expects, in a container pinned
  # by digest.
  linux-jq-1-6:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: handoff.sh checks under jq 1.6 (Ubuntu 22.04)
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/w:ro" \
            ubuntu:22.04@sha256:9abcaffc92a5279fff3a6a41635c0800ea33e528425fb389658806476e7defde \
            bash -c 'set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq jq age python3 >/dev/null
              jq --version; age --version; python3 --version; bash --version | head -1
              useradd -m t
              cp -r /w /home/t/w
              chown -R t /home/t/w
              cd /home/t/w/credential-lockbox/test
              su t -c "HANDOFF_TEST_ONLY=\"3a 3b 5b\" ./run-test.sh"' | tee "$RUNNER_TEMP/run-test-jq16.log"
          grep -qx 'jq-1.6' "$RUNNER_TEMP/run-test-jq16.log" || { echo "the container's jq is not 1.6"; exit 1; }
          grep -q '^ok (refused: payload case rawunitsep)$' "$RUNNER_TEMP/run-test-jq16.log" || { echo "the raw 0x1F payload case did not run"; exit 1; }
          if grep -E '^(skip:|n/a on this OS)' "$RUNNER_TEMP/run-test-jq16.log"; then
            echo "a check was skipped in CI"
            exit 1
          fi

  # The whole suite as root (uid 0), the way Muse's agent runs it: the other
  # jobs run as a plain user, so a regression on root's paths (as #70's /tmp
  # chmod advice was, fixed in #86) passed CI (issue #85). In a container
  # pinned by digest. Three checks can't run as root and print the skip
  # lines listed below; any other skip or "n/a on this OS" line fails, as in
  # the other jobs.
  linux-as-root:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The suite as root (Ubuntu 24.04)
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/w:ro" \
            ubuntu:24.04@sha256:9c7f200c07e3d4a03e7249d2c16bf66a51120fb876aa2242cf31451412543289 \
            bash -c 'set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              # Unpinned on purpose: see the Install step of the macos job.
              apt-get install -y -qq age jq python3 openssl >/dev/null
              echo "uid: $(id -u)"; age --version; jq --version; python3 --version
              cp -r /w /root/w
              cd /root/w/credential-lockbox/test
              ./run-test.sh' | tee "$RUNNER_TEMP/run-test-root.log"
          grep -qx 'uid: 0' "$RUNNER_TEMP/run-test-root.log" || { echo "the suite did not run as root"; exit 1; }
          cat > "$RUNNER_TEMP/root-skips.txt" <<'EOF'
            skip: no owner-only file owned by another user, the key-owner refusal wasn't tested
            skip: no key directories owned by another account and by root (CI makes them), the key-directory owner checks weren't run
            skip: running as root, the read-only blob file check didn't run
          EOF
          sed -i 's/^ *//' "$RUNNER_TEMP/root-skips.txt"
          if grep -E '^(skip:|n/a on this OS)' "$RUNNER_TEMP/run-test-root.log" \
              | grep -vxF -f "$RUNNER_TEMP/root-skips.txt"; then
            echo "a check was skipped as root that only a plain user may skip"
            exit 1
          fi

  macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install age and jq
        # Unpinned on purpose, like apt's age in the Linux jobs: these test the
        # age and jq a user installs today (the next step prints their
        # versions), and linux-age-versions pins the older age releases.
        run: |
          brew install age jq
      - name: Tool versions
        run: |
          sw_vers
          python3 --version
          /bin/bash --version | head -1
          bash --version | head -1
          jq --version
          age --version
          age-keygen --version
          command -v script zsh dash ksh mksh || true
      - name: bash on PATH is 3.2
        # run-test.sh's POSIX-mode round trips run handoff.sh with the bash on
        # PATH; only bash before 5.1 refuses its process substitution in that
        # mode, and nothing else tests that handoff.sh leaves it (see "The
        # scripts parse under bash 3.2"). If the runner image ever puts a newer
        # bash first, those runs would pass without testing it: fail instead.
        run: |
          v=$(bash -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')
          [ "$v" = 3.2 ] || { echo "bash on PATH is $v ($(command -v bash)), not 3.2"; exit 1; }
      - name: A key file owned by another user, for the key-owner refusal
        run: |
          sudo install -o root -g wheel -m 600 \
            credential-lockbox/test/test-dummy-identity.txt "$RUNNER_TEMP/root-owned-key.txt"
          echo "HANDOFF_TEST_OTHER_OWNER_KEY=$RUNNER_TEMP/root-owned-key.txt" >> "$GITHUB_ENV"
      - name: Key directories owned by another account and by root, for the key-directory checks
        run: |
          for d in other-owner-dir:nobody root-dir:root; do
            dir="$RUNNER_TEMP/${d%%:*}"
            sudo install -d -o "${d#*:}" -m 755 "$dir"
            sudo install -o "$(id -u)" -g "$(id -g)" -m 600 credential-lockbox/test/test-dummy-identity.txt "$dir/id.txt"
          done
          echo "HANDOFF_TEST_OTHER_OWNER_DIR=$RUNNER_TEMP/other-owner-dir" >> "$GITHUB_ENV"
          echo "HANDOFF_TEST_ROOT_DIR=$RUNNER_TEMP/root-dir" >> "$GITHUB_ENV"
      - name: Interop and refusal tests
        # A skip line fails the step. "n/a on this OS" lines (no /proc, no
        # /dev/shm, no setsid on macOS) are allowed and printed.
        run: |
          set -o pipefail
          ./credential-lockbox/test/run-test.sh | tee "$RUNNER_TEMP/run-test.log"
          grep '^n/a on this OS' "$RUNNER_TEMP/run-test.log" || true
          if grep '^skip:' "$RUNNER_TEMP/run-test.log"; then
            echo "a check was skipped in CI"
            exit 1
          fi

      - name: Release assets verify with INSTALL-linux-macos.md's macOS command
        # release-assets.sh uses sha256sum if the runner has it and falls back
        # to shasum -a 256; the log shows which exist. The check is INSTALL-linux-macos.md's
        # shasum line, read from its verify-macos-linux block.
        run: |
          command -v sha256sum shasum || true
          .github/scripts/release-assets.sh "$RUNNER_TEMP/assets"
          for f in agent-setup.sh consume.py handoff.ps1 handoff.sh; do
            cmp "$RUNNER_TEMP/assets/$f" "credential-lockbox/$f"
          done
          block=$(.github/scripts/readme-block.sh credential-lockbox/INSTALL-linux-macos.md verify-macos-linux)
          cmd=$(printf '%s\n' "$block" | grep '^shasum -a 256 ' || true)
          [ -n "$cmd" ] || { echo "no shasum command in INSTALL-linux-macos.md's verify-macos-linux block"; exit 1; }
          echo "documented command: $cmd"
          mkdir "$RUNNER_TEMP/sh-only"
          cp "$RUNNER_TEMP/assets/handoff.sh" "$RUNNER_TEMP/assets/SHA256SUMS" "$RUNNER_TEMP/sh-only/"
          cd "$RUNNER_TEMP/sh-only"
          bash -euo pipefail -c "$cmd"
          # SHA256SUMS keeps the sha256sum shape: 64 hex, two spaces, a name.
          [ "$(grep -Ec '^[0-9a-f]{64}  (agent-setup\.sh|consume\.py|handoff\.(ps1|sh))$' "$RUNNER_TEMP/assets/SHA256SUMS")" -eq 4 ]

  # The Windows side (handoff.ps1) only: no bash, and consume.py, agent-setup.sh
  # and run-test.sh are never run here (the agent side is out of scope on
  # Windows). windows-interop opens what this job writes.
  windows:
    needs: assets
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install age.exe (SHA-256 pinned)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $dir = Join-Path $env:RUNNER_TEMP 'age-release'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $dir "age-$env:AGE_VERSION-windows-amd64.zip"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/FiloSottile/age/releases/download/$env:AGE_VERSION/age-$env:AGE_VERSION-windows-amd64.zip" -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($got -ne $env:AGE_WINDOWS_SHA256) { throw "age zip sha256 is $got, expected $env:AGE_WINDOWS_SHA256" }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dir 'age') -Encoding ascii
      - name: Tool versions
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          age --version
          age-keygen --version
      - name: handoff.ps1 tests under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-Process -Id $PID).Path
          $script = Join-Path $PWD 'credential-lockbox\test\run-test.ps1'
          $log = Join-Path $env:RUNNER_TEMP 'run-test-ps5.log'
          $p = Start-Process -FilePath $exe -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', ('"' + $script + '"')) -NoNewWindow -Wait -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          Get-Content -LiteralPath $log
          Get-Content -LiteralPath "$log.err"
          $all = @(Get-Content -LiteralPath $log) + @(Get-Content -LiteralPath "$log.err")
          $all | Where-Object { $_ -like 'n/a on this OS*' }
          if ($p.ExitCode -ne 0) { throw "run-test.ps1 exited $($p.ExitCode)" }
          if ($all | Where-Object { $_ -match '^(skip:|FAIL)' }) { throw 'a check failed or was skipped' }
          if (@(Get-Content -LiteralPath $log)[-1] -ne 'PASS') { throw 'run-test.ps1 did not end in PASS' }
      - name: handoff.ps1 tests under PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-Process -Id $PID).Path
          $script = Join-Path $PWD 'credential-lockbox\test\run-test.ps1'
          $log = Join-Path $env:RUNNER_TEMP 'run-test-ps7.log'
          $p = Start-Process -FilePath $exe -ArgumentList @('-NoProfile', '-File', ('"' + $script + '"')) -NoNewWindow -Wait -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          Get-Content -LiteralPath $log
          Get-Content -LiteralPath "$log.err"
          $all = @(Get-Content -LiteralPath $log) + @(Get-Content -LiteralPath "$log.err")
          $all | Where-Object { $_ -like 'n/a on this OS*' }
          if ($p.ExitCode -ne 0) { throw "run-test.ps1 exited $($p.ExitCode)" }
          if ($all | Where-Object { $_ -match '^(skip:|FAIL)' }) { throw 'a check failed or was skipped' }
          if (@(Get-Content -LiteralPath $log)[-1] -ne 'PASS') { throw 'run-test.ps1 did not end in PASS' }
      - name: Download the release assets built on Linux
        # SHA256SUMS and handoff.ps1 as the assets job built them (the ones
        # that ship), plus INSTALL-windows.md's verify-windows block it extracted.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-check
          path: ${{ runner.temp }}/assets
      - name: Show the downloaded files
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'assets') | Format-Table Name, Length
          Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'assets\verify-windows.ps1')
      - name: INSTALL-windows.md's verify command, PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmd = Join-Path $env:RUNNER_TEMP 'assets\verify-windows.ps1'
          $sb = [scriptblock]::Create((Get-Content -Raw -LiteralPath $cmd))
          $assets = Join-Path $env:RUNNER_TEMP 'assets'
          Push-Location $assets
          try { & $sb } finally { Pop-Location }
          # A changed byte must make it throw.
          $bad = Join-Path $env:RUNNER_TEMP 'tampered7'
          New-Item -ItemType Directory -Force -Path $bad | Out-Null
          Copy-Item (Join-Path $assets 'SHA256SUMS'), (Join-Path $assets 'handoff.ps1') $bad
          Add-Content -LiteralPath (Join-Path $bad 'handoff.ps1') -Value '# tampered'
          Push-Location $bad
          $threw = $false
          try { & $sb } catch { $threw = $true } finally { Pop-Location }
          if (-not $threw) { throw 'the verify command passed on a tampered handoff.ps1' }
      - name: INSTALL-windows.md's verify command, Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cmd = Join-Path $env:RUNNER_TEMP 'assets\verify-windows.ps1'
          $sb = [scriptblock]::Create((Get-Content -Raw -LiteralPath $cmd))
          $assets = Join-Path $env:RUNNER_TEMP 'assets'
          Push-Location $assets
          try { & $sb } finally { Pop-Location }
          $bad = Join-Path $env:RUNNER_TEMP 'tampered5'
          New-Item -ItemType Directory -Force -Path $bad | Out-Null
          Copy-Item (Join-Path $assets 'SHA256SUMS'), (Join-Path $assets 'handoff.ps1') $bad
          Add-Content -LiteralPath (Join-Path $bad 'handoff.ps1') -Value '# tampered'
          Push-Location $bad
          $threw = $false
          try { & $sb } catch { $threw = $true } finally { Pop-Location }
          if (-not $threw) { throw 'the verify command passed on a tampered handoff.ps1' }
      - name: Upload the blobs both editions wrote
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-interop-blobs
          path: ${{ runner.temp }}/handoff-ps-interop
          if-no-files-found: error
          retention-days: 3

  # Opens, on Linux with the reference consume.py, the blobs handoff.ps1 made
  # on Windows under 5.1 and 7: the check output, the non-ASCII values and the
  # CRLF PEM must come out byte for byte.
  windows-interop:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-interop-blobs
          path: ${{ runner.temp }}/windows-interop
      - name: Install age from apt
        # Unpinned on purpose: see the macos job's Install step.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age --version
          python3 --version
      - name: consume.py opens the Windows blobs
        run: |
          find "$RUNNER_TEMP/windows-interop" -type f | sort | head -80
          python3 -I credential-lockbox/test/check-interop.py \
            "$RUNNER_TEMP/windows-interop/ps5" "$RUNNER_TEMP/windows-interop/ps7"

  # The one CI check main's ruleset requires besides QA Gate, once the
  # maintainer swaps it in (see the note at the top of jobs:). It passes
  # only when every job it needs passed. Each kit's jobs
  # cover the platforms that kit supports, so a Linux-only kit adds Linux
  # jobs and the ruleset never changes. Add every new job to `needs` below:
  # a job missing from it fails ci-ok's last step, which names it. All the
  # gate's logic is in .github/scripts/ci-jobs.sh, which the self-test step
  # checks on every run.
  # `if: always()` makes it run, and fail, when a job it needs failed or was
  # canceled: a job skipped because another failed reports "skipped", which
  # a required check would count as passing.
  # Don't give ci.yml an `on: ... paths:` filter: a workflow that doesn't
  # run leaves the required ci-ok check pending and the PR blocked. A job
  # skipped on purpose (its own `if:`) would need a named exception in
  # ci-jobs.sh check; today none is, so anything but success fails.
  # `always()`, not `!cancelled()`, on purpose: in a canceled run a
  # `!cancelled()` gate would be skipped, and a skipped required check counts
  # as passing. Its last step has `if: always()` too, so in a canceled run it
  # still runs and fails on the canceled results. ci-jobs.sh reads ci.yml
  # with yq (preinstalled on Ubuntu runners) and refuses a job-level
  # `continue-on-error`, whose failure would read as success here.
  ci-ok:
    if: always()
    needs:
      - credential-lockbox
      - assets
      - linux-age-versions
      - linux-jq-1-6
      - linux-as-root
      - macos
      - windows
      - windows-interop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ci-jobs.sh self-test (list and check)
        env:
          GATE: ${{ github.job }}
        run: |
          # list: copies of ci.yml with one job added in each YAML form must
          # list exactly the real jobs plus that one; broken or unsafe files
          # must be refused. check: for every job in turn, needs with it
          # missing, skipped, canceled or failed must fail; only every job
          # present and successful passes.
          s=.github/scripts/ci-jobs.sh
          w=.github/workflows/ci.yml
          t="$RUNNER_TEMP/ci-jobs"; mkdir -p "$t"
          j=zz-ci-jobs-selftest
          fx() { echo "::error::self-test fixture: $1 (the self-test, not ci-jobs.sh, needs updating for ci.yml's layout)"; exit 1; }
          base=$("$s" list "$w" 2>&1) || { printf '%s\n' "$base"; echo "::error::$(printf '%s' "$base" | tail -n 1)"; exit 1; }
          if printf '%s\n' "$base" | grep -qx "$j"; then echo "::error::a real job is named $j: rename the self-test's job"; exit 1; fi
          want=$(printf '%s\n' "$base" "$j" | LC_ALL=C sort)
          # The fixtures append jobs at the end and edit the plain `jobs:` line.
          [ "$(yq -r 'keys | .[-1]' "$w")" = jobs ] || fx "jobs: is no longer ci.yml's last top-level key"
          [ "$(grep -c '^jobs:$' "$w")" = 1 ] || fx "ci.yml has no single plain 'jobs:' line"
          add() { cp "$w" "$t/$1.yml"; printf '%s\n' "$2" '    runs-on: ubuntu-latest' '    steps:' '      - run: exit 1' >> "$t/$1.yml"; }
          add plain "  $j:"
          add comment "  $j: # a Linux-only kit"
          add dquoted "  \"$j\":"
          add squoted "  '$j':"
          cp "$w" "$t/flow.yml"; printf '%s\n' "  $j: {runs-on: ubuntu-latest, steps: [{run: exit 1}]}" >> "$t/flow.yml"
          # A decoy jobs: inside a quoted scalar continued at column 0, after
          # the real key is respelled: a line-based reader saw only the decoy.
          sed 's/^jobs:$/jobs :/' "$w" > "$t/decoy.yml"
          printf '%s\n' "  $j:" '    runs-on: ubuntu-latest' '    steps:' '      - name: "x' 'jobs:' '  a:' '          "' '        run: exit 1' >> "$t/decoy.yml"
          # First under jobs:, not last.
          awk -v j="$j" '{ print } /^jobs:$/ && !d { print "  " j ":"; print "    runs-on: ubuntu-latest"; print "    steps:"; print "      - run: exit 1"; d = 1 }' "$w" > "$t/first.yml"
          # A job written as an alias of a template elsewhere in the file.
          cp "$w" "$t/alias.yml"; printf '%s\n' "  $j: *zz-tmpl" >> "$t/alias.yml"
          sed -i 's/^jobs:$/x-tmpl: \&zz-tmpl {runs-on: ubuntu-latest, steps: [{run: exit 1}]}\njobs:/' "$t/alias.yml"
          for c in plain comment dquoted squoted flow decoy first alias; do
            [ "$("$s" list "$t/$c.yml")" = "$want" ] || { echo "::error::ci-jobs.sh didn't list exactly the jobs plus the one added ($c)"; exit 1; }
          done
          # A fixed file with a known answer, so a list that drops a job
          # everywhere (and so agrees with itself above) still fails.
          printf '%s\n' 'on: push' 'jobs:' '  b-two:' '    runs-on: x' '  "a-one":' '    runs-on: x' '  c-three: {runs-on: x}' > "$t/known.yml"
          [ "$("$s" list "$t/known.yml")" = "$(printf '%s\n' a-one b-two c-three)" ] || { echo "::error::ci-jobs.sh list gave the wrong jobs for a known file"; exit 1; }
          printf '%s\n' 'name: x' 'on: push' > "$t/nojobs.yml"
          printf '%s\n' 'jobs: {}' > "$t/emptyjobs.yml"
          printf '%s\n' 'jobs:' '  a: [' > "$t/broken.yml"
          add coe "  $j:"; printf '%s\n' '    continue-on-error: true' >> "$t/coe.yml"
          # continue-on-error reached through an alias.
          cp "$w" "$t/coealias.yml"; printf '%s\n' "  $j: *zz-tmpl" >> "$t/coealias.yml"
          sed -i 's/^jobs:$/x-tmpl: \&zz-tmpl {runs-on: ubuntu-latest, continue-on-error: true, steps: [{run: exit 1}]}\njobs:/' "$t/coealias.yml"
          for c in nojobs emptyjobs broken coe coealias; do
            if "$s" list "$t/$c.yml" >/dev/null 2>&1; then echo "::error::ci-jobs.sh accepted the $c copy"; exit 1; fi
          done
          ok=$(printf '%s\n' "$base" | grep -vxF -- "$GATE" | jq -R -s -c 'split("\n") | map(select(. != "")) | map({(.): {result: "success"}}) | add')
          "$s" check "$w" "$GATE" "$ok" >/dev/null || { echo "::error::ci-jobs.sh check failed needs where every job passed"; exit 1; }
          for k in $(printf '%s' "$ok" | jq -r 'keys[]'); do
            for v in missing skipped cancelled failure; do
              case $v in
                missing) n=$(printf '%s' "$ok" | jq -c --arg k "$k" 'del(.[$k])') ;;
                *) n=$(printf '%s' "$ok" | jq -c --arg k "$k" --arg r "$v" '.[$k].result = $r') ;;
              esac
              if "$s" check "$w" "$GATE" "$n" >/dev/null 2>&1; then echo "::error::ci-jobs.sh check passed with $k $v"; exit 1; fi
            done
          done
          # These also fail by another path; the message must name the cause.
          for n in '[]' 'not json'; do
            if e=$("$s" check "$w" "$GATE" "$n" 2>&1); then echo "::error::ci-jobs.sh check passed with needs $n"; exit 1; fi
            printf '%s' "$e" | grep -q "NEEDS_JSON isn't a JSON object" || { echo "::error::ci-jobs.sh check with needs $n didn't say it isn't an object"; exit 1; }
          done
          if e=$("$s" check "$w" no-such-gate "$ok" 2>&1); then echo "::error::ci-jobs.sh check passed with a gate that isn't a job"; exit 1; fi
          printf '%s' "$e" | grep -q "no job named no-such-gate" || { echo "::error::ci-jobs.sh check with an unknown gate didn't say so"; exit 1; }
          # Ids that contain one another: the gate is matched whole, never as
          # a substring (issue #62). A job named after the gate must still be
          # gated, and a gate id that is only part of a job's id isn't a job.
          for x in "$GATE-zz" "zz-$GATE" "${GATE%?}" "${GATE%%-*}"; do
            if [ -n "$x" ] && printf '%s\n' "$base" | grep -qxF -- "$x"; then fx "$x is a real job id; pick other ids for the gate-substring cases"; fi
          done
          add gateprefix "  $GATE-zz:"
          printf '%s\n' "  zz-$GATE:" '    runs-on: ubuntu-latest' '    steps:' '      - run: exit 1' >> "$t/gateprefix.yml"
          if e=$("$s" check "$t/gateprefix.yml" "$GATE" "$ok" 2>&1); then echo "::error::ci-jobs.sh check passed with $GATE-zz and zz-$GATE left out of needs"; exit 1; fi
          for x in "$GATE-zz" "zz-$GATE"; do
            printf '%s' "$e" | grep -q "aren't gated: .*$x" || { echo "::error::ci-jobs.sh check didn't name $x as ungated"; exit 1; }
          done
          for part in "${GATE%?}" "${GATE%%-*}"; do
            if [ -z "$part" ] || [ "$part" = "$GATE" ]; then continue; fi
            if e=$("$s" check "$w" "$part" "$ok" 2>&1); then echo "::error::ci-jobs.sh check passed with gate $part, part of $GATE"; exit 1; fi
            printf '%s' "$e" | grep -q "no job named $part " || { echo "::error::ci-jobs.sh check with gate $part didn't say it isn't a job"; exit 1; }
          done
          echo "ci-jobs.sh: list gives exactly the jobs for each form tried (aliases included) and refuses broken, jobless, empty and continue-on-error files; check fails for every job missing, skipped, canceled or failed, for bad needs and for an unknown gate, and matches the gate by its whole id (jobs named before or after it are gated; a part of its id isn't a gate)"
      - name: Every job here is gated and passed
        # Also when a run is canceled: then it runs and fails on the
        # canceled results, whatever GitHub does with skipped steps.
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
          GATE: ${{ github.job }}
        run: |
          # The cause (ci-jobs.sh's last line) becomes the run's annotation.
          out=$(.github/scripts/ci-jobs.sh check .github/workflows/ci.yml "$GATE" "$NEEDS" 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::$(printf '%s' "$out" | tail -n 1)"; exit 1; }
          printf '%s\n' "$out"
