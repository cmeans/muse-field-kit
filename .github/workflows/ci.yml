name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token for every job: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # NOTE: pr-labels.yml and pr-labels-ci.yml find this workflow by its name
  # ("CI") and file (ci.yml). If either is renamed, update them too.
  # main's ruleset requires QA Gate and one CI check: "ci-ok" (the last job,
  # which needs all the others). If a required job is renamed, update the
  # ruleset, or every PR waits on a check that never comes.
  # No folder here has scripts since Credential Lockbox moved to
  # credential-lockbox/credential-lockbox (its jobs moved with it), so this
  # checks the docs and CI's own script. A folder that ships scripts adds its
  # jobs here, and to ci-ok's needs. Templates: the jobs and release.yml this
  # repository had at a877955 (before the move), or the ones in
  # credential-lockbox/credential-lockbox, which carried them over.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No CR line endings in the scripts
        # .gitattributes keeps them LF on checkout; this catches a commit
        # that slipped a CR in anyway.
        run: |
          bad=$(git ls-files -z -- '*.sh' '*.py' '*.json' '*.txt' '*.ps1' '*.age' | xargs -0 grep -l $'\r' || true)
          if [ -n "$bad" ]; then
            echo "CR line endings in: $bad"
            exit 1
          fi
      - name: ruff
        # Pinned by hash in .github/ruff-requirements.txt (issue #67 F20).
        run: |
          python3 -m venv "$RUNNER_TEMP/ruff"
          "$RUNNER_TEMP/ruff/bin/pip" install -q --require-hashes --only-binary=:all: -r .github/ruff-requirements.txt
          "$RUNNER_TEMP/ruff/bin/ruff" --version
          "$RUNNER_TEMP/ruff/bin/ruff" check .github/scripts/md-links.py
      - name: The docs link the documents they name, and every relative link to a document works
        # md-links.py: in each section, the first mention of another .md in the
        # repo is a link; every relative .md link names a file and heading that
        # exist. Each bad fixture must fail with its own message, and the good
        # one must pass, or the check is a false green (or a false red).
        run: |
          python3 -I .github/scripts/md-links.py .
          fx() { d="$RUNNER_TEMP/md-$1"; mkdir -p "$d/sub"; printf '# T\n\n## Two words\n' > "$d/OTHER.md"; printf '# S\n' > "$d/STORES.md"; printf '%b' "$2" > "$d/sub/A.md"; echo "$d"; }
          for c in 'unlinked|See `OTHER.md`.\n|unlinked `OTHER.md`' \
                   'broken|See [it](../OTHER.md#nope).\n|no heading #nope' \
                   'missing|See [it](../GONE.md).\n|link to missing' \
                   'stem|Then follow STORES.\n|unlinked STORES'; do
            IFS='|' read -r name text want <<<"$c"
            d=$(fx "$name" "# A\n\n$text")
            if out=$(python3 -I .github/scripts/md-links.py "$d"); then
              echo "md-links.py passed the $name fixture"; exit 1
            fi
            grep -qF "$want" <<<"$out" || { echo "the $name fixture failed for another reason: $out"; exit 1; }
          done
          # Not mentions: a generic one ("a `OTHER.md`"), a quoted one, a heading,
          # a prompt to paste, a later mention in a linked section.
          d=$(fx good '# A\n\nEach folder has a `OTHER.md`. "OTHER.md, step 2"\n\n## OTHER.md\n\n> Read OTHER.md.\n\nSee [`OTHER.md`](../OTHER.md#two-words), then `OTHER.md` again.\n')
          python3 -I .github/scripts/md-links.py "$d"

  # The one CI check main's ruleset requires besides QA Gate. It passes
  # only when every job it needs passed. Each folder's jobs
  # cover the platforms that folder supports, so a Linux-only folder adds
  # Linux jobs and the ruleset never changes. Add every new job to `needs` below:
  # a job missing from it fails ci-ok's last step, which names it. All the
  # gate's logic is in .github/scripts/ci-jobs.sh, which the self-test step
  # checks on every run.
  # `if: always()` makes it run, and fail, when a job it needs failed or was
  # canceled: a job skipped because another failed reports "skipped", which
  # a required check would count as passing.
  # Don't give ci.yml an `on: ... paths:` filter: a workflow that doesn't
  # run leaves the required ci-ok check pending and the PR blocked. A job
  # skipped on purpose (its own `if:`) would need a named exception in
  # ci-jobs.sh check; today none is, so anything but success fails.
  # `always()`, not `!cancelled()`, on purpose: in a canceled run a
  # `!cancelled()` gate would be skipped, and a skipped required check counts
  # as passing. Its last step has `if: always()` too, so in a canceled run it
  # still runs and fails on the canceled results. ci-jobs.sh reads ci.yml
  # with yq (preinstalled on Ubuntu runners) and refuses a job-level
  # `continue-on-error`, whose failure would read as success here.
  ci-ok:
    if: always()
    needs:
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ci-jobs.sh self-test (list and check)
        env:
          GATE: ${{ github.job }}
        run: |
          # list: copies of ci.yml with one job added in each YAML form must
          # list exactly the real jobs plus that one; broken or unsafe files
          # must be refused. check: for every job in turn, needs with it
          # missing, skipped, canceled or failed must fail; only every job
          # present and successful passes.
          s=.github/scripts/ci-jobs.sh
          w=.github/workflows/ci.yml
          t="$RUNNER_TEMP/ci-jobs"; mkdir -p "$t"
          j=zz-ci-jobs-selftest
          fx() { echo "::error::self-test fixture: $1 (the self-test, not ci-jobs.sh, needs updating for ci.yml's layout)"; exit 1; }
          base=$("$s" list "$w" 2>&1) || { printf '%s\n' "$base"; echo "::error::$(printf '%s' "$base" | tail -n 1)"; exit 1; }
          if printf '%s\n' "$base" | grep -qx "$j"; then echo "::error::a real job is named $j: rename the self-test's job"; exit 1; fi
          want=$(printf '%s\n' "$base" "$j" | LC_ALL=C sort)
          # The fixtures append jobs at the end and edit the plain `jobs:` line.
          [ "$(yq -r 'keys | .[-1]' "$w")" = jobs ] || fx "jobs: is no longer ci.yml's last top-level key"
          [ "$(grep -c '^jobs:$' "$w")" = 1 ] || fx "ci.yml has no single plain 'jobs:' line"
          add() { cp "$w" "$t/$1.yml"; printf '%s\n' "$2" '    runs-on: ubuntu-latest' '    steps:' '      - run: exit 1' >> "$t/$1.yml"; }
          add plain "  $j:"
          add comment "  $j: # a Linux-only kit"
          add dquoted "  \"$j\":"
          add squoted "  '$j':"
          cp "$w" "$t/flow.yml"; printf '%s\n' "  $j: {runs-on: ubuntu-latest, steps: [{run: exit 1}]}" >> "$t/flow.yml"
          # A decoy jobs: inside a quoted scalar continued at column 0, after
          # the real key is respelled: a line-based reader saw only the decoy.
          sed 's/^jobs:$/jobs :/' "$w" > "$t/decoy.yml"
          printf '%s\n' "  $j:" '    runs-on: ubuntu-latest' '    steps:' '      - name: "x' 'jobs:' '  a:' '          "' '        run: exit 1' >> "$t/decoy.yml"
          # First under jobs:, not last.
          awk -v j="$j" '{ print } /^jobs:$/ && !d { print "  " j ":"; print "    runs-on: ubuntu-latest"; print "    steps:"; print "      - run: exit 1"; d = 1 }' "$w" > "$t/first.yml"
          # A job written as an alias of a template elsewhere in the file.
          cp "$w" "$t/alias.yml"; printf '%s\n' "  $j: *zz-tmpl" >> "$t/alias.yml"
          sed -i 's/^jobs:$/x-tmpl: \&zz-tmpl {runs-on: ubuntu-latest, steps: [{run: exit 1}]}\njobs:/' "$t/alias.yml"
          for c in plain comment dquoted squoted flow decoy first alias; do
            [ "$("$s" list "$t/$c.yml")" = "$want" ] || { echo "::error::ci-jobs.sh didn't list exactly the jobs plus the one added ($c)"; exit 1; }
          done
          # A fixed file with a known answer, so a list that drops a job
          # everywhere (and so agrees with itself above) still fails.
          printf '%s\n' 'on: push' 'jobs:' '  b-two:' '    runs-on: x' '  "a-one":' '    runs-on: x' '  c-three: {runs-on: x}' > "$t/known.yml"
          [ "$("$s" list "$t/known.yml")" = "$(printf '%s\n' a-one b-two c-three)" ] || { echo "::error::ci-jobs.sh list gave the wrong jobs for a known file"; exit 1; }
          printf '%s\n' 'name: x' 'on: push' > "$t/nojobs.yml"
          printf '%s\n' 'jobs: {}' > "$t/emptyjobs.yml"
          printf '%s\n' 'jobs:' '  a: [' > "$t/broken.yml"
          add coe "  $j:"; printf '%s\n' '    continue-on-error: true' >> "$t/coe.yml"
          # continue-on-error reached through an alias.
          cp "$w" "$t/coealias.yml"; printf '%s\n' "  $j: *zz-tmpl" >> "$t/coealias.yml"
          sed -i 's/^jobs:$/x-tmpl: \&zz-tmpl {runs-on: ubuntu-latest, continue-on-error: true, steps: [{run: exit 1}]}\njobs:/' "$t/coealias.yml"
          for c in nojobs emptyjobs broken coe coealias; do
            if "$s" list "$t/$c.yml" >/dev/null 2>&1; then echo "::error::ci-jobs.sh accepted the $c copy"; exit 1; fi
          done
          ok=$(printf '%s\n' "$base" | grep -vxF -- "$GATE" | jq -R -s -c 'split("\n") | map(select(. != "")) | map({(.): {result: "success"}}) | add')
          "$s" check "$w" "$GATE" "$ok" >/dev/null || { echo "::error::ci-jobs.sh check failed needs where every job passed"; exit 1; }
          for k in $(printf '%s' "$ok" | jq -r 'keys[]'); do
            for v in missing skipped cancelled failure; do
              case $v in
                missing) n=$(printf '%s' "$ok" | jq -c --arg k "$k" 'del(.[$k])') ;;
                *) n=$(printf '%s' "$ok" | jq -c --arg k "$k" --arg r "$v" '.[$k].result = $r') ;;
              esac
              if "$s" check "$w" "$GATE" "$n" >/dev/null 2>&1; then echo "::error::ci-jobs.sh check passed with $k $v"; exit 1; fi
            done
          done
          # These also fail by another path; the message must name the cause.
          for n in '[]' 'not json'; do
            if e=$("$s" check "$w" "$GATE" "$n" 2>&1); then echo "::error::ci-jobs.sh check passed with needs $n"; exit 1; fi
            printf '%s' "$e" | grep -q "NEEDS_JSON isn't a JSON object" || { echo "::error::ci-jobs.sh check with needs $n didn't say it isn't an object"; exit 1; }
          done
          if e=$("$s" check "$w" no-such-gate "$ok" 2>&1); then echo "::error::ci-jobs.sh check passed with a gate that isn't a job"; exit 1; fi
          printf '%s' "$e" | grep -q "no job named no-such-gate" || { echo "::error::ci-jobs.sh check with an unknown gate didn't say so"; exit 1; }
          # Ids that contain one another: the gate is matched whole, never as
          # a substring (issue #62). A job named after the gate must still be
          # gated, and a gate id that is only part of a job's id isn't a job.
          for x in "$GATE-zz" "zz-$GATE" "${GATE%?}" "${GATE%%-*}"; do
            if [ -n "$x" ] && printf '%s\n' "$base" | grep -qxF -- "$x"; then fx "$x is a real job id; pick other ids for the gate-substring cases"; fi
          done
          add gateprefix "  $GATE-zz:"
          printf '%s\n' "  zz-$GATE:" '    runs-on: ubuntu-latest' '    steps:' '      - run: exit 1' >> "$t/gateprefix.yml"
          if e=$("$s" check "$t/gateprefix.yml" "$GATE" "$ok" 2>&1); then echo "::error::ci-jobs.sh check passed with $GATE-zz and zz-$GATE left out of needs"; exit 1; fi
          for x in "$GATE-zz" "zz-$GATE"; do
            printf '%s' "$e" | grep -q "aren't gated: .*$x" || { echo "::error::ci-jobs.sh check didn't name $x as ungated"; exit 1; }
          done
          for part in "${GATE%?}" "${GATE%%-*}"; do
            if [ -z "$part" ] || [ "$part" = "$GATE" ]; then continue; fi
            if e=$("$s" check "$w" "$part" "$ok" 2>&1); then echo "::error::ci-jobs.sh check passed with gate $part, part of $GATE"; exit 1; fi
            printf '%s' "$e" | grep -q "no job named $part " || { echo "::error::ci-jobs.sh check with gate $part didn't say it isn't a job"; exit 1; }
          done
          echo "ci-jobs.sh: list gives exactly the jobs for each form tried (aliases included) and refuses broken, jobless, empty and continue-on-error files; check fails for every job missing, skipped, canceled or failed, for bad needs and for an unknown gate, and matches the gate by its whole id (jobs named before or after it are gated; a part of its id isn't a gate)"
      - name: Every job here is gated and passed
        # Also when a run is canceled: then it runs and fails on the
        # canceled results, whatever GitHub does with skipped steps.
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
          GATE: ${{ github.job }}
        run: |
          # The cause (ci-jobs.sh's last line) becomes the run's annotation.
          out=$(.github/scripts/ci-jobs.sh check .github/workflows/ci.yml "$GATE" "$NEEDS" 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::$(printf '%s' "$out" | tail -n 1)"; exit 1; }
          printf '%s\n' "$out"
